<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <!--Set visual viewport size for mobile devices to the device size,
        witch results in a scale of 1 and a 1:1 mapping between CSS pixels
        and Qt device independent pixels. -->
    <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0"/>

    <title>DB Studio Web</title>
    <style>
      html, body { padding: 0; margin: 0; overflow: hidden; height: 100% }
      #spinner {
        display: flex;
        justify-content: center; /* горизонтальное выравнивание */
        align-items: center;     /* вертикальное выравнивание */
        height: 100vh;           /* на всю высоту viewport */
      }
      #panel { 
        width: 100%; 
        height: 40px; 
        background-color: #f0f0f0; 
        display: flex; 
        align-items: center;
        padding: 2px 5px;
        box-sizing: border-box;
      }
      #panel button {
        margin-right: 5px;
        height: 16px;
        font-size: 10px;
        line-height: 10px;
        padding: 0 4px;
        cursor: pointer;
      }
      #screen { width: 100%; height: 100%; }
    </style>
  </head>
  <body>

    <figure id="spinner">
      <center style="margin-top:1.5em; line-height:150%">
        <strong id="product-name">DB Studio Web</strong>
        <div id="status"></div>
        <noscript>请启用 JavaScript 后使用 DB Studio Web。</noscript>
      </center>
    </figure>

    <div id="screen"></div>

    <!-- <div id="panel">
      <button onclick="onclickTest1()">Test 1</button>
      <button>Test 2</button>
      <button>Test 3</button>
      <input id="load_file" type="file" onchange="window.muapi.loadScoreFile(this.files[0])">
    </div> -->

    <script type="module">
      import createMuApi from "./distr/muapi.js";

      const spinner = document.querySelector('#spinner');
      const screen = document.querySelector('#screen');
      const status = document.querySelector('#status');
      const productName = document.querySelector('#product-name');
      const viewerParams = new URLSearchParams(window.location.search);
      const mode = viewerParams.get('mode') === 'score-editor'
          ? 'score-editor'
          : 'studio-player';
      let playerLayout = viewerParams.get('layout') === 'landscape' ? 'landscape' : 'portrait';
      const productTitle = mode === 'studio-player' ? 'DB Studio Web' : 'DB Score Web';
      document.title = productTitle;
      productName.textContent = productTitle;
      window.DB_PRODUCT_MODE = mode;
      window.DB_PLAYER_READONLY_MODE = false;

      const applyPlayerLayout = () => {
        if (mode !== 'studio-player' || !window.muapi?.setPlayerLayout) {
          return;
        }
        window.muapi.setPlayerLayout(playerLayout, window.innerWidth, window.innerHeight);
      };

      let layoutTimer = 0;
      window.addEventListener('resize', () => {
        window.clearTimeout(layoutTimer);
        layoutTimer = window.setTimeout(applyPlayerLayout, 120);
      });

      window.addEventListener('message', (event) => {
        if (event.origin !== window.location.origin || event.source !== window.parent) {
          return;
        }
        if (event.data?.type === 'DB_PLAYER_SET_LAYOUT') {
          playerLayout = event.data.layout === 'landscape' ? 'landscape' : 'portrait';
          applyPlayerLayout();
          return;
        }
        if (event.data?.type !== 'DB_PLAYER_LOAD_SCORE') {
          return;
        }

        const reply = (result) => {
          event.source.postMessage({
            type: 'DB_PLAYER_LOAD_SCORE_RESULT',
            id: event.data.id,
            ...result,
          }, window.location.origin)
        }

        try {
          if (!window.muapi) throw new Error('DB Score 内核尚未就绪')
          if (mode === 'studio-player' && window.muapi.isReadOnly() !== true) {
            throw new Error('只读播放器内核未就绪')
          }
          if (!(event.data.bytes instanceof Uint8Array)) {
            throw new Error('课件数据格式无效')
          }
          window.muapi.loadScoreData(event.data.bytes)
          const startedAt = performance.now()
          const waitForScore = () => {
            const scoreReady = (window.muapi.playbackState() & 4) !== 0
            const readOnlyReady = mode !== 'studio-player'
                || window.muapi.isInputReadOnly() === true
            if (scoreReady && readOnlyReady) {
              applyPlayerLayout();
              reply({ ok: true })
            } else if (performance.now() - startedAt > 30_000) {
              reply({
                ok: false,
                error: scoreReady
                    ? '只读播放器输入锁未就绪'
                    : 'DB Score 解析课件超时',
              })
            } else {
              setTimeout(waitForScore, 100)
            }
          }
          waitForScore()
        } catch (error) {
          reply({
            ok: false,
            error: error instanceof Error ? error.message : String(error),
          })
        }
      })

      const showUi = (ui) => {
          [spinner, screen].forEach(element => element.style.display = 'none');
          if (screen === ui)
              screen.style.position = 'default';
          ui.style.display = 'block';
      }

      try {
      
        showUi(spinner);
        status.innerHTML = 'Loading...';

        window.muapi = await createMuApi({

          // properties
          screen: screen,
          arguments: [`--db-product-mode=${mode}`],
          productMode: mode,

          // runtime
          onLoaded: () => showUi(screen),
          onExit: function(exitData) {
            status.innerHTML = 'Application exit';
            status.innerHTML += exitData.code !== undefined ? ` with code ${exitData.code}` : '';
            status.innerHTML += exitData.text !== undefined ? ` (${exitData.text})` : '';
            showUi(spinner);
          },

          // api callbacks
          onProjectSaved: function(data) {
            const blob = new Blob([data], { type: "application/octet-stream" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            const stamp = new Date().toISOString().replace(/[:.]/g, "-");
            link.href = url;
            link.download = `DB-Score-${stamp}.db`;
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
          }   
        })

        document.addEventListener('click', window.muapi.startAudioProcessing, { once: true });
    } catch (e) {
        console.error(e);
        console.error(e.stack);
    }
    </script>
    <script src="DBScore.js"></script>
  </body>
</html>
