name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows-portable:
    name: Windows (portable zip)
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure build
        shell: bash
        run: |
          bash ./buildscripts/ci/tools/make_build_mode_env.sh -e "${{ github.event_name }}" -m devel
          bash ./buildscripts/ci/tools/make_build_number.sh
          echo "BUILD_NUMBER=$(cat ./build.artifacts/env/build_number.env)" >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets'
          cache: true

      - name: Setup environment
        shell: cmd
        run: buildscripts\ci\windows\setup.bat

      - name: Build (portable)
        shell: cmd
        run: buildscripts\ci\windows\build.bat --portable ON -n %BUILD_NUMBER%

      - name: Package (zip)
        shell: pwsh
        run: |
          Compress-Archive -Path "build.install\App\MuseScore\*" -DestinationPath "DrumBear-Windows-x64-portable.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrumBear-Windows-x64-portable
          path: DrumBear-Windows-x64-portable.zip

  macos-universal:
    name: "macOS (universal: Apple Silicon + Intel)"
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure build
        shell: bash
        run: |
          bash ./buildscripts/ci/tools/make_build_mode_env.sh -e "${{ github.event_name }}" -m devel
          bash ./buildscripts/ci/tools/make_build_number.sh
          echo "BUILD_NUMBER=$(cat ./build.artifacts/env/build_number.env)" >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets'
          cache: true

      - name: Build (universal)
        shell: bash
        run: bash ./buildscripts/ci/macos/build.sh -n "$BUILD_NUMBER"

      - name: Package (zip)
        shell: bash
        run: |
          cd applebuild
          APP=$(ls -d *.app | head -1)
          echo "Packaging: $APP"
          ditto -c -k --keepParent "$APP" "../DrumBear-macOS-universal.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrumBear-macOS-universal
          path: DrumBear-macOS-universal.zip
